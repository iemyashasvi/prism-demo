<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stripe — via Prism</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <div class="checkout">
    <header>
      <a href="/">← all demos</a>
      <span class="badge badge-prism">Prism</span>
    </header>

    <div class="card-panel">
      <h2>Stripe — via Prism</h2>
      <p class="sub">Server uses <code>hyperswitch-prism</code>. <code>POST /api/prism/stripe/sdk-session</code> + <code>POST /api/prism/stripe/authorize</code>.</p>

      <div class="summary">
        <span class="label">Amount</span>
        <span class="val">$10.00 USD</span>
      </div>

      <div class="test-card">
        <strong>Test card:</strong> 4242 4242 4242 4242 &middot; any future expiry &middot; any CVC
      </div>

      <div id="payment-element"></div>
      <div id="error-msg" class="error-msg"></div>
      <button id="pay-btn" class="pay-btn" disabled>Loading…</button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="/prism/stripe.js"></script>
</body>
</html>
